<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Nizam</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo" id="nav-logo">Nizam<span>.</span></div>
        <ul class="nav-links">
            <li><a href="#about">Tentang</a></li>
            <li><a href="#experience">Pengalaman</a></li>
            <li><a href="#education">Pendidikan</a></li>
            <li><a href="#skills">Kemahiran</a></li>
            <li><a href="#project">Projek</a></li>
            <li><a href="admin.html" class="btn-admin"><i class="fas fa-lock"></i> Admin Login</a></li>
        </ul>
    </nav>

    <!-- HERO (Dengan Gambar Profil) -->
    <header class="hero">
        <div class="hero-content">
            <img id="hero-profile-img" src="images/profile.jpg" alt="Profile Picture" class="profile-pic">
            <h1>Hai, saya <span class="highlight" id="hero-name">...</span></h1>
            <p class="hero-sub" id="hero-title">...</p>
            <div class="hero-btns">
                <a href="#project" class="btn btn-primary">Lihat Projek</a>
            </div>
        </div>
        <div class="hero-glow"></div>
    </header>

    <!-- 1. ABOUT -->
    <section id="about" class="section-container">
        <h2><i class="fas fa-user"></i> About Me</h2>
        <div class="card"><p id="about-text">Memuatkan data...</p></div>
    </section>

    <!-- 2 & 6. EXPERIENCE & LEADERSHIP -->
    <section id="experience" class="section-container">
        <h2><i class="fas fa-briefcase"></i> Work & Leadership Experience</h2>
        <div id="exp-list"></div>
    </section>

    <!-- 3. EDUCATION -->
    <section id="education" class="section-container">
        <h2><i class="fas fa-graduation-cap"></i> Education & Certifications</h2>
        <div id="edu-list"></div>
    </section>

    <!-- 4. SKILLS -->
    <section id="skills" class="section-container">
        <h2><i class="fas fa-code"></i> Skills</h2>
        <div class="skills-grid" id="skills-list"></div>
    </section>

    <!-- 5. PROJECTS -->
    <section id="project" class="section-container">
        <h2><i class="fas fa-laptop-code"></i> Projects</h2>
        <div class="project-grid" id="project-list"></div>
    </section>

    <!-- 7. ACHIEVEMENTS -->
    <section id="achievement" class="section-container">
        <h2><i class="fas fa-trophy"></i> Achievements</h2>
        <div class="card"><ul class="achievement-list" id="achieve-list"></ul></div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 <span id="footer-name">Nizam</span>. Dibina dengan ❤️</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
